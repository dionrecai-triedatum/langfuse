name: Build & Push Patched Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-lockfile:
    name: Regenerate lockfile with security overrides
    runs-on: ubuntu-latest
    outputs:
      lockfile-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pnpm version from package.json `devEngines.packageManager`.
      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate lockfile with overrides
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Hash updated lockfile
        id: hash
        run: echo "hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload updated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: patched-lockfile
          path: pnpm-lock.yaml
          retention-days: 1

  build-web:
    name: Build langfuse (web)
    runs-on: ubuntu-latest
    needs: update-lockfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated lockfile
        uses: actions/download-artifact@v4
        with:
          name: patched-lockfile

      - name: Resolve Langfuse version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/langfuse:latest
            ${{ vars.DOCKERHUB_USERNAME }}/langfuse:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-worker:
    name: Build langfuse-worker
    runs-on: ubuntu-latest
    needs: update-lockfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated lockfile
        uses: actions/download-artifact@v4
        with:
          name: patched-lockfile

      - name: Resolve Langfuse version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/langfuse-worker:latest
            ${{ vars.DOCKERHUB_USERNAME }}/langfuse-worker:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
